name: tvtracker

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tvtime_clone}
      MYSQL_USER: ${MYSQL_USER:-tvtime}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tvtime}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobreescribe el DATABASE_URL del .env: dentro de docker-compose el host
      # de MySQL es el nombre del servicio ("mysql"), no "localhost".
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-tvtime}:${MYSQL_PASSWORD:-tvtime}@mysql:3306/${MYSQL_DATABASE:-tvtime_clone}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
